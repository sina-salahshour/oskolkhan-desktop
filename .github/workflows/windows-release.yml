# Build the Windows x64 installer (NSIS) + portable .exe on a native Windows
# runner and attach them to the GitHub release.
#
#   - Runs automatically when a release is published (scripts/release.sh, or the
#     GitHub UI). Assets already uploaded by release.sh are replaced (--clobber).
#   - Run manually (Actions → "Windows release" → Run workflow) to build the
#     selected branch and attach the result to an existing release tag, e.g. to
#     backfill a release that was cut before Windows builds existed.
name: Windows release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the Windows build to (e.g. v0.1.3)
        required: true

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Build Rust sidecar
        run: |
          cargo build --release -p oskol-core --bin oskol-serve
          mkdir -p app/resources
          cp -f target/release/oskol-serve.exe app/resources/oskol-serve.exe

      - name: Build installer + portable exe
        run: |
          pnpm --dir app install --frozen-lockfile
          pnpm --dir app run win
          ls -la app/dist

      - name: Attach to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$TAG" --clobber \
            app/dist/OskolKhan-Setup-*.exe \
            app/dist/OskolKhan-*-portable.exe \
            app/dist/latest.yml \
            app/dist/OskolKhan-Setup-*.exe.blockmap

      - uses: actions/upload-artifact@v4
        with:
          name: oskolkhan-windows-${{ env.TAG }}
          path: |
            app/dist/*.exe
            app/dist/latest.yml
