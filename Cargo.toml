[workspace]
resolver = "2"
members = ["crates/oskol-core"]

[workspace.package]
version = "0.1.2"
edition = "2021"
license = "UNLICENSED"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "net"] }
tracing = "0.1"

[profile.release]
# LTO is intentionally OFF: ThinLTO drops `ring`'s prebuilt C/asm objects under
# the default rust-lld linker, giving "undefined symbol: ring_core_*" at link
# time. The sidecar isn't hot enough to need LTO.
lto = false
codegen-units = 1
strip = true
