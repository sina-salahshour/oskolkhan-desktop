[workspace]
resolver = "2"
members = ["src-tauri", "crates/oskol-core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "net"] }
tracing = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
