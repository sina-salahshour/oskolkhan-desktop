[package]
name = "oskol-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "OskolKhan desktop core: bootstrap, routing, backend protocol, session and local asset server"

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
prost = "0.14"
prost-reflect = { version = "0.16", features = ["serde", "derive"] }
thiserror = "2"
base64 = "0.22"
brotli = "8"
zstd = "0.14"
hex = "0.4"
rand = "0.9"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex = "1"
futures = "0.3"
bytes = "1"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-manual-roots-no-provider", "gzip", "brotli", "deflate", "zstd", "http2", "stream", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1"
x509-parser = "0.17"
hickory-resolver = { version = "0.24", default-features = false, features = ["tokio-runtime", "system-config"] }
axum = { version = "0.8", default-features = false, features = ["tokio", "http1", "http2"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
open = "5"

[build-dependencies]
prost-build = "0.14"
prost-reflect-build = "0.16"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
